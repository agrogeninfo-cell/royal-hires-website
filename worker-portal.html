<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#062d27"><title>My Salary | Pay Royal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./auth.js"></script><style>
:root{--g:#062d27;--gold:#d7ad63;--ink:#18352e;--muted:#668078;--line:#e3eee6}*{box-sizing:border-box}body{margin:0;background:#f0fdf4;color:var(--ink);font:15px/1.5 system-ui}.top{background:var(--g);color:white;padding:16px;border-bottom:4px solid var(--gold)}.brand{max-width:900px;margin:auto;display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border:2px solid var(--gold);border-radius:14px;display:grid;place-items:center;color:var(--gold);font-size:28px;font-weight:900}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:white;border:1px solid #eaf1eb;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 28px #062d270a}.muted{color:var(--muted);font-size:13px}.metric{font-size:32px;font-weight:900;color:var(--g);margin:8px 0}.between{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}.btn{background:var(--g);color:white;border:0;border-radius:99px;padding:11px 18px;font-weight:800;cursor:pointer}.gold{color:#92713a}.empty{padding:22px;text-align:center;color:var(--muted);background:#f8fbf8;border-radius:14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}.toast{color:#a33}.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}@media print{.top button,.no-print{display:none!important}body{background:white}.card{box-shadow:none;break-inside:avoid}}</style></head><body><header class="top"><div class="brand"><div class="logo">R</div><div><b>Royal Hires</b><div class="gold" style="font-size:11px">MY WORKER PORTAL</div></div></div></header><main class="wrap"><section class="card"><div class="muted">WELCOME</div><h1 id="workerName">Loading your profile…</h1><div class="muted" id="workerMeta"></div></section><section class="card"><div class="between"><div><b>My Salary Statements</b><div class="muted">Only records linked to your employee account</div></div><button class="btn no-print" onclick="window.print()">Print / Save PDF</button></div><div id="salaryList"><div class="empty">Loading your salary records…</div></div></section><div class="card no-print"><button class="btn" id="logout">Sign out</button><p class="muted">If a salary statement is missing, please contact the Royal Hires office.</p></div></main><div class="footer">Pay Royal · Royal Hires Private Limited</div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cash=n=>'Rs. '+Number(n||0).toLocaleString('en-LK',{maximumFractionDigits:2});
document.addEventListener('payroyal:authenticated',async e=>{const p=e.detail,db=window.PayRoyalAuth.client;if(p.role!=='worker'||!p.employee_id){location.replace('worker-login.html');return}document.querySelector('#logout').onclick=()=>window.PayRoyalAuth.signOut();const {data:emp,error:ee}=await db.from('employees').select('labour_code,name,factory,gender').eq('id',p.employee_id).maybeSingle();if(ee||!emp){document.querySelector('#workerName').textContent='Profile unavailable';document.querySelector('#salaryList').textContent='Please contact Royal Hires office.';return}document.querySelector('#workerName').textContent=emp.name;document.querySelector('#workerMeta').textContent=emp.labour_code+' · '+(emp.factory||'Royal Hires')+' · '+(emp.gender||'');const {data:rows,error}=await db.from('settlements').select('id,period,period_start,period_end,days,ot_hours,gross_pay,gross,ot_pay,bonus,meal_deduction,late_deduction,advance_deduction,net_pay,net_payable,factory_name,created_at').eq('employee_id',p.employee_id).order('created_at',{ascending:false}).limit(24);const host=document.querySelector('#salaryList');if(error){host.innerHTML='<div class="empty">Salary records could not be loaded. Please contact the office.</div>';return}if(!rows?.length){host.innerHTML='<div class="empty">No salary statement has been issued yet.</div>';return}host.innerHTML=rows.map((r,i)=>{const net=r.net_pay??r.net_payable??0;return '<article class="card" style="border:1px solid var(--line);box-shadow:none"><div class="muted">SALARY PERIOD</div><h2 style="margin:2px 0">'+esc(r.period||((r.period_start||'')+' – '+(r.period_end||''))||'Salary statement')+'</h2><div class="metric">'+cash(net)+'</div><div class="between"><span>Attendance days</span><b>'+Number(r.days||0).toFixed(1)+'</b></div><div class="between"><span>OT hours</span><b>'+Number(r.ot_hours||0).toFixed(1)+'</b></div><div class="between"><span>Gross pay</span><b>'+cash(r.gross_pay??r.gross)+'</b></div><div class="between"><span>OT pay</span><b>'+cash(r.ot_pay)+'</b></div><div class="between"><span>Bonus</span><b>'+cash(r.bonus)+'</b></div><div class="between"><span>Meal deduction</span><b>− '+cash(r.meal_deduction)+'</b></div><div class="between"><span>Late deduction</span><b>− '+cash(r.late_deduction)+'</b></div><div class="between"><span>Advance deduction</span><b>− '+cash(r.advance_deduction)+'</b></div><div class="between"><b>Net payable</b><b>'+cash(net)+'</b></div><div class="muted" style="margin-top:8px">Factory: '+esc(r.factory_name||emp.factory||'Royal Hires')+'</div></article>'}).join('')});
</script></body></html>
