<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#062d27"><title>Worker Login | Royal Hires</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(140deg,#062d27,#0b5145);font:15px/1.5 system-ui;color:#18352e}.panel{width:min(100%,420px);background:#fff;border-radius:26px;padding:28px;box-shadow:0 24px 80px #001b1880}.mark{width:58px;height:58px;border:2px solid #d7ad63;border-radius:18px;display:grid;place-items:center;color:#d7ad63;background:#062d27;font-size:32px;font-weight:900}.eyebrow{margin-top:20px;color:#92713a;font-size:11px;letter-spacing:2px;font-weight:800}h1{margin:5px 0;color:#062d27;font-size:28px}.muted{color:#71847c;font-size:13px}.field{width:100%;padding:14px;border:1px solid #dce8e0;border-radius:13px;margin:7px 0 15px;font:inherit}.btn{width:100%;padding:14px;border:0;border-radius:99px;background:#062d27;color:white;font:inherit;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6}.msg{margin-top:14px;font-size:13px;min-height:20px;color:#a33}.foot{text-align:center;margin-top:20px;color:#75867f;font-size:11px}a{color:#176b59}</style></head>
<body><main class="panel"><div class="mark">R</div><div class="eyebrow">ROYAL HIRES PRIVATE LIMITED</div><h1>Worker Login</h1><p class="muted">Enter your employee code and private PIN to view only your own salary details.</p>
<form id="f"><label class="muted" for="code">Employee ID Code</label><input class="field" id="code" required maxlength="40" autocomplete="username" placeholder="e.g. RHSP200" autocapitalize="characters"><label class="muted" for="pin">PIN (6–10 digits)</label><input class="field" id="pin" type="password" inputmode="numeric" pattern="[0-9]{6,10}" minlength="6" maxlength="10" required autocomplete="current-password" placeholder="••••••"><button class="btn" id="go">Sign in securely</button></form><div class="msg" id="msg" role="alert"></div><div class="foot">Need help? Contact Royal Hires office.<br><a href="login.html">Admin / Staff Login</a></div></main>
<script>
const SUPABASE_URL='https://jwghmsflabvzzhucuwsn.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhbGciOiJIUzI1NiIsInJlZiI6Imp3Z2htc2ZsYWJ2enpodWN1d3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNTM4NzUsImV4cCI6MjEwODcyOTg3NX0.JgUcVdMOTnYP1Txp_U2xO8R3Txvp0QEQnAvwnpxX5sU';
const ENDPOINT=SUPABASE_URL+'/functions/v1/worker-portal';
document.querySelector('#f').addEventListener('submit',async e=>{e.preventDefault();const b=document.querySelector('#go'),m=document.querySelector('#msg');b.disabled=true;b.textContent='Verifying…';m.textContent='';try{const response=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},body:JSON.stringify({action:'login',memberId:document.querySelector('#code').value.trim().toUpperCase(),pin:document.querySelector('#pin').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Invalid employee code or PIN.');if(!data.token)throw new Error('Secure session could not be created.');localStorage.setItem('royalWorkerSession',JSON.stringify({token:data.token,expiresAt:data.expiresAt}));location.replace('worker-portal.html')}catch(x){m.textContent=x.message||'Unable to sign in.';b.disabled=false;b.textContent='Sign in securely'}});
</script></body></html>
