<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#062d27"><title>Worker Login | Pay Royal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="./auth.js"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(140deg,#062d27,#0b5145);font:15px/1.5 system-ui;color:#18352e}.panel{width:min(100%,420px);background:#fff;border-radius:26px;padding:28px;box-shadow:0 24px 80px #001b1880}.mark{width:58px;height:58px;border:2px solid #d7ad63;border-radius:18px;display:grid;place-items:center;color:#d7ad63;background:#062d27;font-size:32px;font-weight:900}.eyebrow{margin-top:20px;color:#92713a;font-size:11px;letter-spacing:2px;font-weight:800}h1{margin:5px 0;color:#062d27;font-size:28px}.muted{color:#71847c;font-size:13px}.field{width:100%;padding:14px;border:1px solid #dce8e0;border-radius:13px;margin:7px 0 15px;font:inherit}.btn{width:100%;padding:14px;border:0;border-radius:99px;background:#062d27;color:white;font:inherit;font-weight:800;cursor:pointer}.msg{margin-top:14px;font-size:13px;min-height:20px;color:#a33}.foot{text-align:center;margin-top:20px;color:#75867f;font-size:11px}a{color:#176b59}</style></head>
<body><main class="panel"><div class="mark">R</div><div class="eyebrow">ROYAL HIRES PRIVATE LIMITED</div><h1>Worker Login</h1><p class="muted">Enter your employee code and private 6-digit PIN to view your own salary details.</p>
<form id="f"><label class="muted" for="code">Employee ID Code</label><input class="field" id="code" required maxlength="20" autocomplete="username" placeholder="e.g. RHSP200" autocapitalize="characters"><label class="muted" for="pin">6-digit PIN</label><input class="field" id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required autocomplete="current-password" placeholder="••••••"><button class="btn" id="go">Sign in securely</button></form><div class="msg" id="msg" role="alert"></div><div class="foot">Need help? Contact Royal Hires office.<br><a href="login.html">Admin / Staff Login</a></div></main>
<script>
const cfg=window.PayRoyalSupabaseConfig;if(!cfg||!window.supabase){document.querySelector('#msg').textContent='Secure login is unavailable. Refresh and try again.'}else{const sb=window.supabase.createClient(cfg.url,cfg.key);document.querySelector('#f').addEventListener('submit',async e=>{e.preventDefault();const b=document.querySelector('#go'),m=document.querySelector('#msg');b.disabled=true;b.textContent='Verifying…';m.textContent='';try{const {data,error}=await sb.functions.invoke('royal-worker-login',{body:{action:'worker-sign-in',labour_code:document.querySelector('#code').value.trim().toUpperCase(),pin:document.querySelector('#pin').value}});if(error)throw error;if(!data?.session)throw new Error(data?.error||'Invalid employee code or PIN.');const {error:setError}=await sb.auth.setSession({access_token:data.session.access_token,refresh_token:data.session.refresh_token});if(setError)throw setError;location.replace('worker-portal.html')}catch(x){m.textContent=x.message||'Unable to sign in.';b.disabled=false;b.textContent='Sign in securely'}})}
</script></body></html>
