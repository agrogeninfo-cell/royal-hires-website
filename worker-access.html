<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#062d27"><title>Worker PIN Management | Pay Royal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./auth.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f0f7f2;color:#18352e;font:15px/1.5 system-ui}.top{background:#062d27;color:white;padding:16px;border-bottom:4px solid #d7ad63}.brand{max-width:760px;margin:auto;display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border:2px solid #d7ad63;border-radius:14px;display:grid;place-items:center;color:#d7ad63;font-size:27px;font-weight:900}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:white;border:1px solid #e3eee6;border-radius:18px;padding:20px;margin:14px 0}.muted{font-size:13px;color:#668078}.field{width:100%;padding:12px;border:1px solid #dce8e0;border-radius:10px;font:inherit;margin:6px 0 14px}.btn{background:#062d27;color:white;border:0;border-radius:99px;padding:12px 18px;font-weight:800;cursor:pointer}.msg{font-size:13px;margin-top:12px}.danger{color:#a33}.ok{color:#176b59}.gold{color:#d7ad63}</style></head>
<body><header class="top"><div class="brand"><div class="logo">R</div><div><b>Royal Hires</b><div class="gold" style="font-size:11px">ADMIN · WORKER ACCESS</div></div></div></header>
<main class="wrap"><section class="card"><h1>Worker PIN Management</h1><p class="muted">Assign or reset a worker's private PIN. PINs are securely hashed on the server and are never displayed again.</p><form id="pinForm"><label for="member">Employee Code</label><input class="field" id="member" maxlength="40" required placeholder="e.g. RHTESTM001" autocomplete="off"><label for="pin">New PIN (6–10 digits)</label><input class="field" id="pin" type="password" inputmode="numeric" pattern="[0-9]{6,10}" minlength="6" maxlength="10" required autocomplete="new-password"><button class="btn" id="save">Save Worker PIN</button></form><div id="status" class="msg" role="status"></div></section><p class="muted"><a href="index.html">← Return to Admin Dashboard</a></p></main>
<script>
const status=document.querySelector('#status');document.addEventListener('payroyal:authenticated',async e=>{if(e.detail.role!=='admin'){status.textContent='Administrator access only.';status.className='msg danger';document.querySelector('#pinForm').hidden=true}});
document.querySelector('#pinForm').addEventListener('submit',async e=>{e.preventDefault();const p=window.PayRoyalAuth;if(!p?.session?.access_token){status.textContent='Admin session unavailable. Sign in again.';status.className='msg danger';return}const memberId=document.querySelector('#member').value.trim().toUpperCase(),pin=document.querySelector('#pin').value;if(!/^[A-Z0-9-]{3,40}$/.test(memberId)||!/^[0-9]{6,10}$/.test(pin)){status.textContent='Check employee code and PIN format.';status.className='msg danger';return}const b=document.querySelector('#save');b.disabled=true;b.textContent='Saving securely…';status.textContent='';try{const r=await fetch('https://jwghmsflabvzzhucuwsn.supabase.co/functions/v1/worker-portal',{method:'POST',headers:{'Content-Type':'application/json','apikey':window.PayRoyalSupabaseConfig.key,'Authorization':'Bearer '+p.session.access_token},body:JSON.stringify({action:'admin-set-pin',memberId,pin})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'PIN could not be saved');document.querySelector('#pin').value='';status.textContent='PIN saved for '+memberId+'. Give the PIN directly to the worker; do not share it in chat.';status.className='msg ok'}catch(x){status.textContent=x.message||'PIN update failed';status.className='msg danger'}finally{b.disabled=false;b.textContent='Save Worker PIN'}});
</script></body></html>
