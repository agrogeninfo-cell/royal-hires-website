<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#062d27"><title>My Salary | Royal Hires</title>
<style>:root{--g:#062d27;--gold:#d7ad63;--ink:#18352e;--muted:#668078;--line:#e3eee6}*{box-sizing:border-box}body{margin:0;background:#f0f7f2;color:var(--ink);font:15px/1.5 system-ui}.top{background:var(--g);color:white;padding:16px;border-bottom:4px solid var(--gold)}.brand{max-width:900px;margin:auto;display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border:2px solid var(--gold);border-radius:14px;display:grid;place-items:center;color:var(--gold);font-size:28px;font-weight:900}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:white;border:1px solid #eaf1eb;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 28px #062d270a}.muted{color:var(--muted);font-size:13px}.metric{font-size:30px;font-weight:900;color:var(--g);margin:8px 0}.between{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.btn{background:var(--g);color:white;border:0;border-radius:99px;padding:11px 18px;font-weight:800;cursor:pointer}.gold{color:var(--gold)}.empty{padding:22px;text-align:center;color:var(--muted);background:#f8fbf8;border-radius:14px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}@media print{.no-print{display:none!important}body{background:white}.card{box-shadow:none;break-inside:avoid}}</style></head>
<body><header class="top"><div class="brand"><div class="logo">R</div><div><b>Royal Hires</b><div class="gold" style="font-size:11px">MY WORKER PORTAL</div></div></div></header>
<main class="wrap"><section class="card"><div class="muted">WELCOME</div><h1 id="workerName">Loading your profile…</h1><div class="muted" id="workerMeta"></div></section><section class="card"><div class="between"><div><b>My Salary Statements</b><div class="muted">Only statements belonging to your employee code</div></div><button class="btn no-print" onclick="window.print()">Print / Save PDF</button></div><div id="salaryList"><div class="empty">Loading your salary records…</div></div></section><div class="card no-print"><button class="btn" id="logout">Sign out</button><p class="muted">If a salary statement is missing, contact the Royal Hires office.</p></div></main><div class="footer">Pay Royal · Royal Hires Private Limited</div>
<script>
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhbGciOiJIUzI1NiIsInJlZiI6Imp3Z2htc2ZsYWJ2enpodWN1d3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNTM4NzUsImV4cCI6MjEwODcyOTg3NX0.JgUcVdMOTnYP1Txp_U2xO8R3Txvp0QEQnAvwnpxX5sU',API='https://jwghmsflabvzzhucuwsn.supabase.co/functions/v1/worker-portal';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cash=n=>'Rs. '+Number(n||0).toLocaleString('en-LK',{maximumFractionDigits:2});
let session;try{session=JSON.parse(localStorage.getItem('royalWorkerSession')||'null')}catch(_){}
async function call(action){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON},body:JSON.stringify({action,token:session?.token})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Portal request failed');return d}
async function boot(){if(!session?.token||!session.expiresAt||Date.parse(session.expiresAt)<=Date.now()){location.replace('worker-login.html');return}try{const d=await call('me');const p=d.profile||{};document.querySelector('#workerName').textContent=p.fullName||'Worker';document.querySelector('#workerMeta').textContent=[p.memberId,p.factory,p.phone].filter(Boolean).join(' · ');const host=document.querySelector('#salaryList');if(!d.payrolls?.length){host.innerHTML='<div class="empty">No approved salary statement has been issued yet.</div>';return}host.innerHTML=d.payrolls.map(r=>'<article class="card" style="border:1px solid var(--line);box-shadow:none"><div class="muted">SALARY PERIOD</div><h2 style="margin:2px 0">'+esc(r.periodStart)+' – '+esc(r.periodEnd)+'</h2><div class="metric">'+cash(r.netPayable)+'</div><div class="between"><span>Attendance days</span><b>'+Number(r.daysWorked||0).toFixed(1)+'</b></div><div class="between"><span>Gross earnings</span><b>'+cash(r.grossEarnings)+'</b></div><div class="between"><span>Breakfast ('+Number(r.breakfastCount||0)+')</span><b>'+cash(r.breakfastCost)+'</b></div><div class="between"><span>Lunch ('+Number(r.lunchCount||0)+')</span><b>'+cash(r.lunchCost)+'</b></div><div class="between"><span>Dinner ('+Number(r.dinnerCount||0)+')</span><b>'+cash(r.dinnerCost)+'</b></div><div class="between"><span>Total meal deductions</span><b>− '+cash(r.totalMealDeductions)+'</b></div><div class="between"><span>Other deductions</span><b>− '+cash(Math.max(0,Number(r.totalDeductions||0)-Number(r.totalMealDeductions||0)))+'</b></div><div class="between"><b>Net payable</b><b>'+cash(r.netPayable)+'</b></div><div class="between"><span>Paid so far</span><b>'+cash(r.amountPaid)+'</b></div><div class="between"><span>Remaining balance</span><b>'+cash(r.remainingBalance)+'</b></div><div class="muted" style="margin-top:8px">Status: '+esc(r.paymentStatus||r.status)+'</div></article>').join('')}catch(e){localStorage.removeItem('royalWorkerSession');document.querySelector('#workerName').textContent='Please sign in again';document.querySelector('#salaryList').innerHTML='<div class="empty">'+esc(e.message)+'</div><p><a href="worker-login.html">Return to Worker Login</a></p>'}}
document.querySelector('#logout').onclick=async()=>{try{await call('logout')}catch(_){}localStorage.removeItem('royalWorkerSession');location.replace('worker-login.html')};boot();
</script></body></html>
