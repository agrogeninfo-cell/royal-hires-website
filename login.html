<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#062d27"><title>Secure Login | Pay Royal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#062d27,#0b5145);font:15px/1.5 Inter,system-ui,sans-serif;color:#18352e}.panel{width:min(100%,430px);background:#fff;border-radius:26px;padding:30px;box-shadow:0 24px 80px #001b1880}.mark{width:58px;height:58px;border:2px solid #d7ad63;border-radius:18px;display:grid;place-items:center;color:#d7ad63;background:#062d27;font-size:32px;font-weight:900}.eyebrow{color:#92713a;font-size:11px;letter-spacing:2px;font-weight:800;margin-top:20px}h1{margin:5px 0;color:#062d27;font-size:28px}.muted{color:#71847c;font-size:13px}.field{width:100%;padding:14px;border:1px solid #dce8e0;border-radius:13px;margin:7px 0 15px;font:inherit}.btn{width:100%;padding:14px;border:0;border-radius:99px;background:#062d27;color:white;font-weight:800;font:inherit;cursor:pointer}.link{border:0;background:none;color:#176b59;text-decoration:underline;padding:10px 0;cursor:pointer;font:inherit;font-size:13px}.msg{margin-top:14px;font-size:13px;color:#a33;min-height:20px}.foot{text-align:center;margin-top:20px;color:#75867f;font-size:11px}.hidden{display:none!important}
</style></head><body><main class="panel"><div class="mark">R</div><div class="eyebrow">ROYAL HIRES PRIVATE LIMITED</div><h1>Pay Royal Login</h1><p class="muted">Sign in with your authorised account to access workforce and payroll records.</p>
<section id="loginPanel"><form id="loginForm"><label class="muted" for="email">Email address</label><input class="field" id="email" type="email" autocomplete="username" required placeholder="name@example.com"><label class="muted" for="password">Password</label><input class="field" id="password" type="password" autocomplete="current-password" required placeholder="Your password"><button class="btn" id="loginBtn" type="submit">Sign in securely</button></form><button class="link" id="forgotBtn" type="button">Forgot password?</button></section>
<section id="resetPanel" class="hidden"><p class="muted">Enter your new password after opening the secure reset link sent to your Gmail.</p><form id="resetForm"><label class="muted" for="newPassword">New password</label><input class="field" id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters"><label class="muted" for="confirmPassword">Confirm new password</label><input class="field" id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Re-enter password"><button class="btn" id="resetBtn" type="submit">Save new password</button></form></section>
<div id="msg" class="msg" role="alert" aria-live="polite"></div><div class="foot">Protected access · Pay Royal</div></main>
<script>
const URL='https://jwghmsflabvzzhucuwsn.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3Z2htc2ZsYWJ2enpodWN1d3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNTM4NzUsImV4cCI6MjEwODcyOTg3NX0.JgUcVdMOTnYP1Txp_U2xO8R3Txvp0QEQnAvwnpxX5sU';
const sb=window.supabase.createClient(URL,KEY), msg=document.querySelector('#msg');
const loginPanel=document.querySelector('#loginPanel'), resetPanel=document.querySelector('#resetPanel');
const params=new URLSearchParams(location.search);
if(params.get('reason')==='access')msg.textContent='This account is inactive or not authorised. Contact the administrator.';
if(params.get('error'))msg.textContent='The password reset link is invalid or expired. Request a new one.';
(async()=>{
 const {data:{session}}=await sb.auth.getSession();
 if(location.hash.includes('type=recovery') || params.get('reset')==='1'){loginPanel.classList.add('hidden');resetPanel.classList.remove('hidden');}
 else if(session){const {data:p}=await sb.from('user_profiles').select('role,is_active').eq('user_id',session.user.id).maybeSingle();if(p&&p.is_active)location.replace('index.html');}
})();
document.querySelector('#loginForm').addEventListener('submit',async e=>{
 e.preventDefault();const btn=document.querySelector('#loginBtn');btn.disabled=true;btn.textContent='Verifying…';msg.textContent='';
 const {data,error}=await sb.auth.signInWithPassword({email:document.querySelector('#email').value.trim(),password:document.querySelector('#password').value});
 if(error){msg.textContent=error.message;btn.disabled=false;btn.textContent='Sign in securely';return;}
 const {data:p,error:pe}=await sb.from('user_profiles').select('role,is_active').eq('user_id',data.user.id).maybeSingle();
 if(pe||!p||!p.is_active||!['admin','office_staff','supervisor','worker'].includes(p.role)){await sb.auth.signOut();msg.textContent='Access not authorised. Contact Royal Hires administrator.';btn.disabled=false;btn.textContent='Sign in securely';return;}
 location.replace(p.role==='worker'?'salary-check.html':'index.html');
});
document.querySelector('#forgotBtn').addEventListener('click',async()=>{
 const email=document.querySelector('#email').value.trim();if(!email){msg.textContent='Enter your Gmail address first.';document.querySelector('#email').focus();return;}
 const btn=document.querySelector('#forgotBtn');btn.disabled=true;msg.style.color='#176b59';msg.textContent='Sending password reset email…';
 const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname+'?reset=1'});
 if(error){msg.style.color='#a33';msg.textContent=error.message;}else{msg.style.color='#176b59';msg.textContent='If this account exists, a password reset email has been sent. Check Gmail Inbox and Spam.';}
 btn.disabled=false;
});
document.querySelector('#resetForm').addEventListener('submit',async e=>{
 e.preventDefault();const a=document.querySelector('#newPassword').value,b=document.querySelector('#confirmPassword').value;
 if(a!==b){msg.style.color='#a33';msg.textContent='Passwords do not match.';return;}
 const btn=document.querySelector('#resetBtn');btn.disabled=true;btn.textContent='Saving…';
 const {error}=await sb.auth.updateUser({password:a});
 if(error){msg.style.color='#a33';msg.textContent=error.message;btn.disabled=false;btn.textContent='Save new password';return;}
 msg.style.color='#176b59';msg.textContent='Password updated. Please sign in with your new password.';
 await sb.auth.signOut();resetPanel.classList.add('hidden');loginPanel.classList.remove('hidden');document.querySelector('#password').value='';btn.disabled=false;btn.textContent='Save new password';
});
</script></body></html>
