<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#062d27"><title>Royal Hires | Blog Studio Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#041f1b,#0b453b);font:16px Arial,sans-serif;display:grid;place-items:center;padding:20px;color:#12352d}.card{width:min(100%,440px);background:#fff;border-radius:24px;padding:32px;box-shadow:0 24px 70px #0004}.brand{color:#062d27;font-size:24px;font-weight:800}.gold{color:#b58a3d}.sub{color:#6b7e76;margin:8px 0 24px}label{display:block;font-weight:700;margin:16px 0 7px}input{width:100%;padding:14px;border:1px solid #d9e5dc;border-radius:12px;font-size:16px}button{width:100%;padding:15px;border:0;border-radius:12px;background:#d7ad63;color:#062d27;font-weight:800;font-size:16px;margin-top:18px}button:disabled{opacity:.6}#loginMessage{margin-top:14px;padding:12px;border-radius:10px;white-space:pre-wrap}.error{background:#fff0f0;color:#a32626}.info{background:#eff8f2;color:#155b3b}.tiny{font-size:12px;color:#74857d;margin-top:18px}
</style></head><body><main class="card"><div class="brand">ROYAL HIRES <span class="gold">BLOG STUDIO</span></div><p class="sub">Secure administrator sign in</p><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" placeholder="Enter admin email"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password"><button id="signIn" type="button">Sign in</button><div id="loginMessage" role="status"></div><p class="tiny">Private administrator access · Royal Hires</p></main>
<script>
(()=>{const $=id=>document.getElementById(id),btn=$('signIn'),msg=$('loginMessage');function say(t,kind='info'){msg.className=kind;msg.textContent=t;}
btn.addEventListener('click',login);$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
function loadSdk(url,fail){const s=document.createElement('script');s.src=url;s.onload=()=>{if(!window.supabase?.createClient){fail();return;}auth();};s.onerror=fail;document.head.appendChild(s);}
function auth(){const client=window.supabase.createClient('https://ilakuhupgjlgyvpnlyan.supabase.co','sb_publishable_aTNoTcgIPgU8tvkG5xozlg_qKKUcw9V');btn.disabled=false; say('Login system ready. Enter your admin credentials.');async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){say('Please enter both email and password.','error');return;}btn.disabled=true;btn.textContent='Signing in…';say('Checking credentials securely…');try{const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;if(!data.session)throw new Error('No session returned.');if(data.session.user.app_metadata?.role!=='admin'){await client.auth.signOut();throw new Error('Login succeeded, but this account is not assigned administrator access.');}say('Admin login successful. Opening Blog Studio…');location.replace('./blog-admin.html?admin=1');}catch(e){say(e.message||'Login failed.','error');}finally{btn.disabled=false;btn.textContent='Sign in';}}}
loadSdk('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',()=>loadSdk('https://unpkg.com/@supabase/supabase-js@2',()=>say('Unable to load login library. Check internet connection and reload.','error')));
})();
</script></body></html>
