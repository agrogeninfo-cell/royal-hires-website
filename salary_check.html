:root{
  --bg:#062D27;
  --bg2:#041E1A;
  --surface:#fff;
  --gold:#D8B451;
  --gold2:#F3D98A;
  --gold-dark:#A97F22;
  --ink:#0D231F;
  --muted:#687875;
  --line:#E4DDC8;
  --red:#B9252B;
  --red-bg:#FFF0F0;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html{
  background:var(--bg)
}

body{
  margin:0;
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color:var(--ink)
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

.app-shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 16px 28px;
  background:radial-gradient(circle at 50% -15%, #147061 0, transparent 42%), linear-gradient(145deg,#082F2A 0%,#062D27 45%,#041B18 100%);
  position:relative;
  overflow-x:clip
}

.glow{
  position:absolute;
  border-radius:999px;
  filter:blur(4px);
  pointer-events:none
}

.glow-a{
  width:150px;
  height:150px;
  border:1px solid rgba(216,180,81,.2);
  right:-55px;
  top:85px
}

.glow-b{
  width:95px;
  height:95px;
  border:1px solid rgba(216,180,81,.14);
  left:-35px;
  top:280px
}

.page{
  position:relative;
  max-width:480px;
  margin:0 auto
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
  padding:28px 2px 20px
}

.logo{
  width:64px;
  height:64px;
  -o-object-fit:cover;
     object-fit:cover;
  border-radius:16px;
  border:2px solid var(--gold);
  box-shadow:0 10px 28px rgba(0,0,0,.35);
  flex:0 0 auto;
  background:#fff
}

.brand-copy{
  min-width:0
}

.company{
  color:var(--gold);
  font-size:10px;
  font-weight:800;
  letter-spacing:1.8px;
  margin:0 0 4px
}

.brand h1{
  color:#fff;
  font-size:32px;
  line-height:1;
  margin:0 0 6px;
  letter-spacing:-.7px
}

.subtitle{
  color:#c8d7d2;
  font-size:14px;
  margin:0
}

.card{
  background:#fff;
  border:1px solid #E6C87E;
  border-radius:28px;
  padding:24px;
  box-shadow:0 24px 70px rgba(0,0,0,.35), 0 0 0 3px rgba(216,180,81,.08)
}

.card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px
}

.eyebrow{
  font-size:10px;
  letter-spacing:1.7px;
  font-weight:800;
  color:var(--gold-dark);
  display:flex;
  align-items:center;
  gap:7px;
  margin:0 0 10px
}

.gold-dot{
  width:7px;
  height:7px;
  background:var(--gold);
  border-radius:50%;
  box-shadow:0 0 0 4px #FFF5D8;
  display:inline-block
}

.card-top h2{
  font-size:23px;
  line-height:1.18;
  letter-spacing:-.6px;
  margin:0;
  color:#102B26
}

.secure-badge{
  display:flex;
  align-items:center;
  gap:4px;
  background:#EDF7F2;
  color:#116244;
  border-radius:999px;
  padding:6px 8px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap
}

.intro{
  color:var(--muted);
  font-size:13.5px;
  line-height:1.6;
  margin:16px 0 22px
}

.field-label{
  display:block;
  font-weight:800;
  font-size:13px;
  margin-bottom:8px
}

.input-wrap{
  position:relative
}

.input-icon{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:#8A7950
}

.input-wrap input{
  width:100%;
  height:58px;
  border:2px solid #D9C271;
  border-radius:15px;
  background:#FFFEF7;
  padding:0 44px 0 47px;
  color:#102B26;
  font-size:19px;
  font-weight:800;
  letter-spacing:1.5px;
  outline:none
}

.input-wrap input::-moz-placeholder{
  color:#A8A4A1;
  letter-spacing:1.5px
}

.input-wrap input::placeholder{
  color:#A8A4A1;
  letter-spacing:1.5px
}

.input-wrap input:focus{
  border-color:#B48C28;
  box-shadow:0 0 0 4px rgba(216,180,81,.2)
}

.clear-btn{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:#eee9da;
  border-radius:50%;
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  color:#5b5a52
}

.help{
  color:#77817E;
  font-size:12px;
  margin:10px 2px 18px
}

.help button{
  border:0;
  background:none;
  color:#9A7319;
  font-weight:800;
  padding:0
}

.help span{
  margin:0 4px
}

.primary{
  width:100%;
  height:56px;
  border:0;
  border-radius:14px;
  background:linear-gradient(180deg,#F1D67E,#D6AC3E);
  color:#092D28;
  font-weight:900;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  box-shadow:0 8px 20px rgba(194,149,34,.28)
}

.primary:hover{
  filter:brightness(1.03)
}

.primary:active{
  transform:translateY(1px)
}

.error{
  margin-top:18px;
  background:var(--red-bg);
  border:1px solid #F1C5C5;
  color:var(--red);
  border-radius:14px;
  padding:13px;
  display:flex;
  gap:11px;
  align-items:flex-start
}

.error-mark{
  width:26px;
  height:26px;
  flex:0 0 26px;
  border-radius:50%;
  background:var(--red);
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:900
}

.error strong{
  font-size:14px
}

.error p{
  margin:2px 0 0;
  color:#93353A;
  font-size:13px
}

.result{
  margin-top:22px;
  border-top:1px solid #EDE6D5;
  padding-top:20px
}

.result-head{
  display:flex;
  align-items:center;
  gap:11px
}

.avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  background:#103E36;
  color:#F0D97A;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:15px;
  flex:0 0 auto
}

.person{
  min-width:0;
  flex:1
}

.person h3{
  margin:0;
  font-size:18px;
  line-height:1.1
}

.person p{
  margin:4px 0 0;
  color:#78817E;
  font-size:12px;
  font-weight:700;
  letter-spacing:.4px
}

.verified{
  color:#14714F;
  font-size:11px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:3px;
  white-space:nowrap
}

.meta-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin:17px 0
}

.meta-grid>div{
  background:#F8F7F0;
  border:1px solid #EEE7D0;
  border-radius:13px;
  padding:11px 12px;
  display:grid;
  grid-template-columns:18px 1fr;
  -moz-column-gap:6px;
       column-gap:6px
}

.meta-grid svg{
  color:#A07E28;
  grid-row:span 2;
  align-self:center
}

.meta-grid span{
  font-size:11px;
  color:#7C857F
}

.meta-grid strong{
  font-size:14px
}

.summary{
  background:#FFFDF4;
  border:1px solid #EBDCAE;
  border-radius:14px;
  padding:4px 14px
}

.summary-row{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #F0E9D2
}

.summary-row:last-child{
  border-bottom:0
}

.summary-row span{
  color:#68726F;
  font-size:13px
}

.summary-row b{
  font-size:14px
}

.meal-box{
  margin-top:12px;
  border:1px solid #E7DEC7;
  border-radius:16px;
  overflow:hidden
}

.meal-title{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 15px;
  background:#F8F6EF
}

.meal-title>svg{
  color:#A07E28
}

.meal-title h4{
  margin:0;
  font-size:14px
}

.meal-title p{
  margin:1px 0 0;
  color:#7A827E;
  font-size:11px
}

.meal-total-label{
  margin-left:auto;
  color:#777;
  font-size:11px
}

.meal-lines{
  padding:6px 15px
}

.meal-line{
  display:grid;
  grid-template-columns:24px 1fr auto auto;
  gap:7px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px dashed #E8DFC9;
  font-size:13px
}

.meal-line:last-child{
  border:0
}

.meal-code{
  width:24px;
  height:24px;
  border-radius:7px;
  background:#FFF0B8;
  color:#775B08;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:11px
}

.meal-name{
  font-weight:700
}

.meal-math{
  color:#7B817D
}

.meal-footer{
  display:flex;
  justify-content:space-between;
  background:#FFF6C9;
  padding:12px 15px;
  font-size:13px
}

.net{
  margin:12px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(120deg,#0B3A33,#08382E);
  color:#fff;
  border-radius:16px;
  padding:16px
}

.net>div{
  display:grid
}

.net span{
  color:#F1D879;
  font-size:12px;
  font-weight:800
}

.net small{
  color:#B8C8C2;
  font-size:11px;
  margin-top:3px
}

.net strong{
  font-size:24px;
  letter-spacing:-.5px
}

.payslip{
  width:100%;
  height:50px;
  border:1px solid #C7A33B;
  background:linear-gradient(180deg,#F1D67E,#DFB94C);
  border-radius:13px;
  color:#092D28;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px
}

.payslip-preview{
  margin-top:12px;
  border:1px solid #D9C977;
  border-radius:15px;
  padding:16px;
  background:#FFFDF6
}

.slip-head{
  display:flex;
  gap:10px;
  align-items:center;
  border-bottom:1px solid #E8E0C8;
  padding-bottom:13px
}

.slip-head img{
  border-radius:9px;
  border:1px solid #D9B854
}

.slip-head>div{
  display:grid
}

.slip-head strong{
  font-size:11px;
  letter-spacing:.4px
}

.slip-head span{
  font-size:10px;
  color:#7D847F;
  margin-top:3px
}

.slip-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
  margin:14px 0
}

.slip-grid>div{
  display:grid;
  gap:3px
}

.slip-grid span,.slip-line span{
  color:#777;
  font-size:11px
}

.slip-grid b,.slip-line b{
  font-size:13px
}

.slip-line{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-top:1px dashed #E6DEC6
}

.slip-line.total{
  border-top:2px solid #D4B34E
}

.slip-note{
  font-size:11px;
  line-height:1.5;
  color:#777;
  margin:10px 0 0
}

footer{
  padding:18px 6px 0;
  color:#AEC2BC;
  font-size:12px;
  text-align:center
}

footer>div{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px
}

footer a{
  color:#F0D97A;
  text-decoration:none;
  font-weight:800;
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:11px
}

@media(max-width:390px){
  .app-shell{
    padding-left:12px;
    padding-right:12px
  }

  .card{
    padding:20px 16px
  }

  .brand{
    padding-top:22px
  }

  .brand h1{
    font-size:29px
  }

  .card-top h2{
    font-size:21px
  }

  .meal-line{
    grid-template-columns:23px 1fr auto
  }

  .meal-math{
    display:none
  }

  .net strong{
    font-size:21px
  }

  .secure-badge span{
    display:none
  }

  .secure-badge{
    padding:7px
  }
}

@media (prefers-color-scheme: dark){
  .card{
    background:#FDFDF9
  }
}
